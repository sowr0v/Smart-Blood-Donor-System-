<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Blood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="global-navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon-wrap">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 10.5 14.5 3.5 12 2C9.5 3.5 4.5 10.5 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="#D32F2F"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Smart Blood</span>
          <span class="brand-sub">Donor Network</span>
        </div>
      </a>
      <div class="nav-auth-actions">
        <a href="/auth/login" class="btn btn-outline">Login</a>
        <a href="/auth/register?role=donor" class="btn btn-primary">Register</a>
      </div>
    </div>
  </header>

  <main class="main-shell">
    <div class="container">
      <section class="urgent-board-section" aria-labelledby="urgent-board-heading">
        <div class="urgent-board-header">
          <div>
            <span class="eyebrow">Critical Needs</span>
            <h1 id="urgent-board-heading">Urgent Blood Board</h1>
            <p class="hero-subtext">Real-time emergency requests requiring immediate donor response.</p>
          </div>
          
          <div class="urgent-board-filters">
            <label class="filter-label">
              <span>Blood Group</span>
              <select id="urgent-blood-filter">
                <option value="">All Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </label>
            <label class="filter-label">
              <span>District</span>
              <select id="urgent-district-filter">
                <option value="">All Districts</option>
              </select>
            </label>
          </div>
        </div>

        <div class="urgent-board-status-bar">
          <span id="urgent-board-status" role="status" aria-live="polite">Loading active emergency requests...</span>
        </div>

        <div class="urgent-request-list" id="urgent-request-list" aria-live="polite">
          <!-- Populated by main.js -->
        </div>

        <div class="urgent-board-empty" id="urgent-board-empty" hidden>
          <p>No critical requests found matching your criteria right now.</p>
        </div>
      </section>
    </div>
  </main>
  <script src="/static/js/main.js"></script>
</body>
</html>
