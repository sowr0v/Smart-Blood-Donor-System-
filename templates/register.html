<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="global-navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon-wrap">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 10.5 14.5 3.5 12 2C9.5 3.5 4.5 10.5 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="#D32F2F"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Smart Blood</span>
          <span class="brand-sub">Donor Network</span>
        </div>
      </a>
    </div>
  </header>

  <main class="main-shell">
    <div class="container narrow-container">
      <section class="page-panel form-panel">
        <span class="eyebrow">Join the network</span>
        <h1>Register as a {{ selected_role|title }}</h1>
        <p class="hero-subtext">Create your account to help save lives and respond to local emergencies.</p>

        <div class="role-switcher">
          <button class="role-chip {% if selected_role == 'donor' %}active{% endif %}">Donor</button>
          <button class="role-chip {% if selected_role == 'seeker' %}active{% endif %}">Seeker</button>
          <button class="role-chip">Hospital</button>
        </div>

        <form class="search-panel">
          <label>
            Full name
            <input type="text" placeholder="Your name" />
          </label>
          <label>
            Email
            <input type="email" placeholder="you@example.com" />
          </label>
          <label>
            Phone number
            <input type="tel" placeholder="+8801..." />
          </label>
          <button type="button" class="btn btn-primary btn-cta">Create account</button>
        </form>
      </section>
    </div>
  </main>
  {% include "partials/public_footer.html" %}
</body>
</html>
