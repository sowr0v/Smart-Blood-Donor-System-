<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="global-navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon-wrap">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 10.5 14.5 3.5 12 2C9.5 3.5 4.5 10.5 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="#D32F2F"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Smart Blood</span>
          <span class="brand-sub">Donor Network</span>
        </div>
      </a>
    </div>
  </header>

  <main class="main-shell">
    <div class="container narrow-container">
      <section class="page-panel form-panel">
        <span class="eyebrow">Join the network</span>
        <h1>Register as a {{ selected_role|title }}</h1>
        <p class="hero-subtext">Create your account to help save lives and respond to local emergencies.</p>

        <div class="role-switcher" style="margin-bottom: 2rem; display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 0.5rem;">
          <label for="role-select" style="font-weight: 500; color: var(--text-primary);">Select your role:</label>
          <select id="role-select" class="role-select" style="padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 1rem; width: 100%; max-width: 300px; font-family: inherit;">
            <option value="donor" {% if selected_role == 'donor' or not selected_role %}selected{% endif %}>Blood Donor</option>
            <option value="seeker" {% if selected_role == 'seeker' %}selected{% endif %}>Blood Seeker</option>
            <option value="bank" {% if selected_role == 'bank' %}selected{% endif %}>Blood Bank</option>
            <option value="hospital" {% if selected_role == 'hospital' %}selected{% endif %}>Hospital</option>
          </select>
        </div>

        <!-- Individual Form (Donor, Seeker) -->
        <form class="search-panel multi-role-form" id="form-individual">
          <input type="hidden" name="role" value="donor" id="individual-role-input">
          <div class="field-row">
            <label>Name<input type="text" name="name" placeholder="Full Name" required /></label>
            <label>Phone Number<input type="tel" name="phone" placeholder="+8801..." required /></label>
          </div>
          <div class="field-row">
            <label>NID<input type="text" name="nid" placeholder="National ID Number" required /></label>
            <label>Blood Group
              <select name="blood_group" required>
                <option value="">Select Group</option>
                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
              </select>
            </label>
          </div>
          <label>Address<input type="text" name="address" placeholder="Full Address" required /></label>
          <label>Password<input type="password" name="password" placeholder="Create a password" required /></label>
          
          <label class="checkbox-label">
            <input type="checkbox" name="allow_location" required /> Allow Location Access
          </label>
          
          <button type="submit" class="btn btn-primary btn-cta">Register as <span id="btn-text-individual">Blood Donor</span></button>
        </form>

        <!-- Organization Form (Blood Bank, Hospital) -->
        <form class="search-panel multi-role-form" id="form-organization" style="display: none;">
          <input type="hidden" name="role" value="bank" id="organization-role-input">
          <div class="field-row">
            <label>Organization Name<input type="text" name="org_name" placeholder="Name of Organization" required /></label>
            <label>Phone Number<input type="tel" name="phone" placeholder="+8801..." required /></label>
          </div>
          <div class="field-row">
            <label>Manager Number<input type="tel" name="manager_number" placeholder="+8801..." required /></label>
            <label>Govt Reg. Number<input type="text" name="govt_reg" placeholder="Registration No" required /></label>
          </div>
          <label>Address<input type="text" name="address" placeholder="Full Address" required /></label>
          <label>Password<input type="password" name="password" placeholder="Create a password" required /></label>
          
          <label class="checkbox-label">
            <input type="checkbox" name="allow_location" required /> Allow Location Access
          </label>
          
          <button type="submit" class="btn btn-primary btn-cta">Register as <span id="btn-text-organization">Blood Bank</span></button>
        </form>
      </section>
    </div>
  </main>
  {% include "partials/public_footer.html" %}
  <script src="/static/js/main.js"></script>
</body>
</html>
