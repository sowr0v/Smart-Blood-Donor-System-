<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="global-navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon-wrap">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.5C16.1421 21.5 19.5 18.1421 19.5 14C19.5 10.5 14.5 3.5 12 2C9.5 3.5 4.5 10.5 4.5 14C4.5 18.1421 7.85786 21.5 12 21.5Z" fill="#D32F2F"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Smart Blood</span>
          <span class="brand-sub">Donor Network</span>
        </div>
      </a>
      <div class="nav-auth-actions">
        <a href="/login" class="btn btn-outline">Logout</a>
      </div>
    </div>
  </header>

  <main class="main-shell">
    <div class="container">
      <section class="page-panel">
        <span class="eyebrow">{{ role }} Portal</span>
        <h1>{{ title }}</h1>
        <p class="hero-subtext">You have been successfully authenticated and redirected to your dashboard.</p>
        <div class="metrics-row">
          <article class="metric-card">
            <strong>24</strong>
            <span>Active alerts</span>
          </article>
          <article class="metric-card">
            <strong>12</strong>
            <span>Nearby matches</span>
          </article>
          <article class="metric-card">
            <strong>98%</strong>
            <span>Response confidence</span>
          </article>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
